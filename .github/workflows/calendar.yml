name: Atualizar Calendário Econômico

on:
  schedule:
    # Atualiza agenda 4 vezes por dia em dias úteis.
    # Horários em UTC: 08h, 12h, 16h e 20h.
    - cron: '0 8,12,16,20 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements-calendar.txt

      - name: Atualizar calendário
        run: python scripts/fetch_calendar.py

      - name: Commit calendar.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendaario-economico/calendar.json
          git diff --cached --quiet || git commit -m "chore: calendar update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
