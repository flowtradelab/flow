name: Atualizar Calendário Econômico

on:
  schedule:
    # A cada 30min, dias úteis, 7h–22h BRT (= 10h–01h UTC)
    - cron: '0,30 10-23 * * 1-5'
    - cron: '0,30 0-1  * * 2-6'
  workflow_dispatch: # permite rodar manualmente

jobs:
  fetch-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install httpx beautifulsoup4

      - name: Buscar calendário
        run: python scripts/fetch_calendar.py

      - name: Commit calendar.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/calendar.json
          git diff --cached --quiet || git commit -m "chore: calendar update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
