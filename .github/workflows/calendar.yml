name: Atualizar Calendário Econômico

on:
  schedule:
    # Atualiza agenda 4 vezes por dia em dias úteis.
    # Horários de Brasília: 05:07, 09:07, 13:07 e 17:07.
    - cron: '7 5,9,13,17 * * 1-5'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:

concurrency:
  group: economic-calendar
  cancel-in-progress: false

jobs:
  fetch-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements-calendar.txt

      - name: Atualizar agenda
        run: python scripts/fetch_calendar.py

      - name: Reaplicar resultados já conhecidos
        run: python scripts/update_calendar_results.py

      - name: Commit calendário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendaario-economico/calendar.json calendaario-economico/calendar-results.json
          git diff --cached --quiet || git commit -m "chore: calendar update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
