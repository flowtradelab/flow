name: Atualizar Resultados do Calendário

on:
  schedule:
    # A cada 15 minutos, dias úteis, de 08:00 a 18:45 BRT.
    # BRT = UTC-3, portanto 11h-21h UTC.
    - cron: '*/15 11-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: economic-calendar
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements-calendar.txt

      - name: Atualizar resultados divulgados
        run: python scripts/update_calendar_results.py

      - name: Commit resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendaario-economico/calendar.json calendaario-economico/calendar-results.json
          git diff --cached --quiet || git commit -m "chore: economic calendar results $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
