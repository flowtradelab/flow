name: IV Update Diário

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 10h horário de Brasília (13h UTC), dias úteis
  workflow_dispatch:           # permite rodar manualmente pelo GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install yfinance

      - name: Rodar update diário
        run: python iv-tracker-br/scripts/update_diario.py

      - name: Commit e push dos JSONs atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iv-tracker-br/data/iv_history/
          git diff --staged --quiet || git commit -m "iv update $(date +'%Y-%m-%d')"
          git push
