name: Atualizar Fluxo B3

on:
  schedule:
    - cron: '7 8 * * 1-5'  # 08:07 em Brasília, segunda a sexta
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:         # Permite rodar manualmente também

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Scraping e geração do CSV
        run: |
          python3 - <<'PYEOF' > perfil-investidores/perfil-investidores.csv
          import re
          import subprocess
          import sys

          url = "https://www.dadosdemercado.com.br/fluxo"

          # -s silencioso, mas -w nos dá o status HTTP e o tamanho baixado
          # separadamente do corpo, para não perder essa informação como
          # antes. -L segue redirecionamentos (ex.: http -> https).
          curl_cmd = [
              "curl", "-s", "-L", "--max-time", "30",
              "-H", "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                    "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              "-H", "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "-H", "Accept-Language: pt-BR,pt;q=0.9,en;q=0.8",
              "-w", "\n__HTTP_STATUS__:%{http_code}",
              url,
          ]
          result = subprocess.run(curl_cmd, capture_output=True, text=True)

          raw = result.stdout
          if "__HTTP_STATUS__:" in raw:
              page, status_marker = raw.rsplit("__HTTP_STATUS__:", 1)
              http_status = status_marker.strip()
          else:
              page, http_status = raw, "desconhecido"

          # --- Diagnóstico: sempre vai para stderr, então aparece no log do
          # Actions mesmo quando o passo falha, sem contaminar o CSV (stdout).
          print(f"[diag] HTTP status: {http_status}", file=sys.stderr)
          print(f"[diag] curl exit code: {result.returncode}", file=sys.stderr)
          print(f"[diag] tamanho do corpo: {len(page)} bytes", file=sys.stderr)
          if result.stderr:
              print(f"[diag] curl stderr: {result.stderr.strip()}", file=sys.stderr)
          print(f"[diag] primeiros 500 caracteres da resposta:\n{page[:500]}", file=sys.stderr)
          print(f"[diag] contém '<table'? {'<table' in page}", file=sys.stderr)
          print(f"[diag] contém 'captcha'/'cloudflare'/'blocked'? "
                f"{any(k in page.lower() for k in ('captcha', 'cloudflare', 'blocked', 'access denied'))}",
                file=sys.stderr)

          from html.parser import HTMLParser
          from datetime import datetime
          import csv
          import io
          from pathlib import Path

          class TableParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows = []
                  self.row = None
                  self.cell = None
                  self.depth = 0

              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row = []
                  elif tag in ("td", "th") and self.row is not None:
                      self.cell = []
                      self.depth = 1
                  elif self.cell is not None:
                      self.depth += 1

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ("td", "th") and self.cell is not None:
                      self.row.append(" ".join("".join(self.cell).split()))
                      self.cell = None
                      self.depth = 0
                  elif tag == "tr" and self.row is not None:
                      self.rows.append(self.row)
                      self.row = None

          parser = TableParser()
          parser.feed(page)
          print(f"[diag] linhas HTML encontradas: {len(parser.rows)}", file=sys.stderr)

          headers = ["data", "estrangeiro", "institucional",
                     "pessoa_fisica", "inst_financeira", "outros"]
          date_pattern = re.compile(r"^\d{2}/\d{2}/\d{4}$")
          value_pattern = re.compile(r"^([+\-−]?\s*[\d.]+,\d{1,2})\s*mi$", re.I)
          new_data = {}

          for cells in parser.rows:
              if len(cells) != 6 or not date_pattern.fullmatch(cells[0]):
                  continue
              try:
                  date = datetime.strptime(cells[0], "%d/%m/%Y")
                  values = []
                  for cell in cells[1:]:
                      match = value_pattern.fullmatch(cell.replace("\xa0", " ").strip())
                      if not match:
                          raise ValueError(f"valor inesperado: {cell!r}")
                      value = match.group(1).replace(" ", "").replace("−", "-")
                      values.append(value.replace(".", "").replace(",", "."))
                  new_data[date.strftime("%d/%m/%Y")] = values
              except ValueError as exc:
                  print(f"[diag] linha ignorada {cells[0]}: {exc}", file=sys.stderr)

          print(f"[diag] registros válidos extraídos: {len(new_data)}", file=sys.stderr)
          if len(new_data) < 5:
              raise RuntimeError(
                  f"Extração insuficiente: {len(new_data)} registros (HTTP {http_status}). "
                  "CSV anterior preservado; verifique o HTML e os logs [diag]."
              )

          # Mantém o histórico já salvo e substitui somente datas atualizadas.
          target = Path("perfil-investidores/perfil-investidores.csv")
          merged = {}
          if target.exists():
              with target.open(newline="", encoding="utf-8") as file:
                  for item in csv.DictReader(file):
                      try:
                          datetime.strptime(item["data"], "%d/%m/%Y")
                          merged[item["data"]] = [item[h] for h in headers[1:]]
                      except (KeyError, ValueError):
                          print("[diag] registro histórico inválido ignorado", file=sys.stderr)
          merged.update(new_data)
          print(f"[diag] total após mesclar histórico: {len(merged)}", file=sys.stderr)

          writer = csv.writer(sys.stdout, lineterminator="\n")
          writer.writerow(headers)
          for day in sorted(merged, key=lambda value: datetime.strptime(value, "%d/%m/%Y"), reverse=True):
              writer.writerow([day] + merged[day])
          PYEOF

          echo "Registros extraídos: $(wc -l < perfil-investidores/perfil-investidores.csv)"

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add perfil-investidores/perfil-investidores.csv

          if git diff --cached --quiet; then
            echo "Nenhuma alteração — CSV já está atualizado."
          else
            git commit -m "Atualização automática fluxo B3 - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M')"
            git push
          fi
