name: Atualizar Fluxo B3

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 8h BRT = 11h UTC, segunda a sexta
  workflow_dispatch:         # Permite rodar manualmente também

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Scraping e geração do CSV
        run: |
          HTML=$(curl -s --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (compatible; FlowBot/1.0)" \
            "https://www.dadosdemercado.com.br/fluxo")

          python3 - <<'PYEOF' > perfil-investidores/perfil-investidores.csv
          import sys, re

          import urllib.request
          page = open('/dev/stdin').read() if False else None

          import subprocess
          result = subprocess.run(
              ['curl', '-s', '--max-time', '30',
               '-H', 'User-Agent: Mozilla/5.0 (compatible; FlowBot/1.0)',
               'https://www.dadosdemercado.com.br/fluxo'],
              capture_output=True, text=True
          )
          page = result.stdout

          rows = re.findall(
              r'<tr>\s*<td[^>]*>([\d/]+)</td>\s*'
              r'<td[^>]*>([\d.,\-]+)\s*mi</td>\s*'
              r'<td[^>]*>([\d.,\-]+)\s*mi</td>\s*'
              r'<td[^>]*>([\d.,\-]+)\s*mi</td>\s*'
              r'<td[^>]*>([\d.,\-]+)\s*mi</td>\s*'
              r'<td[^>]*>([\d.,\-]+)\s*mi</td>\s*'
              r'</tr>',
              page
          )

          def fmt(v):
              return v.replace('.', '').replace(',', '.')

          lines = ["data,estrangeiro,institucional,pessoa_fisica,inst_financeira,outros"]
          for r in rows:
              data, est, inst, pf, if_, out = r
              lines.append(f"{data},{fmt(est)},{fmt(inst)},{fmt(pf)},{fmt(if_)},{fmt(out)}")

          if len(lines) < 2:
              raise Exception("Nenhum dado extraído — layout do site pode ter mudado")

          print('\n'.join(lines))
          PYEOF

          echo "Registros extraídos: $(wc -l < perfil-investidores/perfil-investidores.csv)"

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add perfil-investidores/perfil-investidores.csv

          if git diff --cached --quiet; then
            echo "Nenhuma alteração — CSV já está atualizado."
          else
            git commit -m "Atualização automática fluxo B3 - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M')"
            git push
          fi
