name: Update Pair Trading Data

on:
  # Todo dia útil às 07:00 BRT (10:00 UTC) — antes da abertura da B3
  schedule:
    - cron: '0 10 * * 1-5'

  # Permite rodar manualmente pelo GitHub
  workflow_dispatch:

jobs:
  update-pairs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pairs

      - name: Instalar dependências
        run: |
          pip install yfinance pandas numpy scipy statsmodels

      - name: Rodar script de atualização
        run: |
          python scripts/update_pairs.py

      - name: Commit e push se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pair-trading/pairs.json
          git diff --cached --quiet || git commit -m "chore: update pairs $(date +'%Y-%m-%d')"
          git push