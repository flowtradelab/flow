name: 📑 Atualizar Fundamentos (CVM)

on:
  schedule:
    - cron: '0 11 * * 1'   # Toda segunda-feira às 11:00 UTC (08:00 BRT)
  workflow_dispatch:         # Permite rodar manualmente pelo GitHub

jobs:
  update-fundamentos:
    name: Baixar e commitar dados da CVM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # Permite fazer commit

    steps:
      - name: 📥 Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: pip install pandas requests yfinance

      - name: 🔄 Baixar dados brutos da CVM (DFP, ITR, cadastro, ticker↔CNPJ)
        run: python scripts/update_fundamentos.py

      - name: 🧮 Montar resumo por ticker (cruza com quant/ + proventos)
        run: python scripts/update_fundamentos_view.py

      - name: 📤 Commit e push dos dados atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fundamentos/
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "📑 Atualização fundamentos CVM $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
